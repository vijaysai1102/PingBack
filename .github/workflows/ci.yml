name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, types
    # PingBack declares os: [win32, darwin], so npm ci fails on Linux runners.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # 20.19 is the lowest version the dev toolchain installs cleanly on,
        # and is the closest practical check on the declared >=20 floor.
        node: ['20.19', 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Must precede the tests: the sound assets are generated by the build and
      # are not committed, and SoundService asserts they exist.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  package:
    name: Package smoke (${{ matrix.os }})
    needs: [quality, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Installs the real tarball so a broken bin path, a missing asset or a
      # bad file list fails here rather than for a user running npm install -g.
      - name: Pack and install globally
        run: |
          TARBALL=$(npm pack --silent)
          echo "packed $TARBALL"
          npm install -g "./$TARBALL"

      - name: CLI runs from outside the repo
        working-directory: ${{ runner.temp }}
        run: |
          pingback --version
          pingback --help

      - name: Bundled sounds resolve after global install
        working-directory: ${{ runner.temp }}
        run: |
          GLOBAL_ROOT=$(npm root -g)
          # Passed to node as argv so path.join normalizes the Windows separators.
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            for (const name of ['attention', 'completion', 'error']) {
              const file = path.join(process.argv[1], 'pingback-cli', 'assets', 'sounds', name + '.wav');
              if (!fs.existsSync(file)) {
                console.error('missing bundled sound: ' + file);
                process.exit(1);
              }
              console.log('ok ' + file);
            }
          " "$GLOBAL_ROOT"

      - name: Daemon lifecycle
        working-directory: ${{ runner.temp }}
        run: |
          # "Not running" also contains the word "running", so the running state
          # is asserted by the absence of that phrase rather than by matching it.
          assert_stopped() {
            pingback status > status.txt || { cat status.txt; exit 1; }
            cat status.txt
            grep -q "Not running" status.txt || { echo "expected stopped"; exit 1; }
          }
          assert_running() {
            pingback status > status.txt || { cat status.txt; exit 1; }
            cat status.txt
            if grep -q "Not running" status.txt; then echo "expected running"; exit 1; fi
            grep -q "Running" status.txt || { echo "expected running"; exit 1; }
          }

          assert_stopped
          pingback start
          assert_running
          pingback stop
          assert_stopped

      - name: Config round-trip
        working-directory: ${{ runner.temp }}
        run: |
          pingback config | grep -q "notifications.sound = true"
          pingback config set notifications.sound false
          pingback config | grep -q "notifications.sound = false"
          pingback config set notifications.sound true

          # Invalid input must fail loudly rather than silently succeed.
          if pingback config set bogus.key true; then
            echo "expected an unknown config key to exit non-zero"
            exit 1
          fi
